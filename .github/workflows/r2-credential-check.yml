name: "Check R2 credential scope"
"on":
  workflow_dispatch:
    inputs:
      channel:
        description: "Target package channel"
        required: true
        type: "choice"
        options:
          - "stable"
          - "testing"
      package_id:
        description: "Application or package identifier"
        required: true
        type: "string"
      version:
        description: "Release version"
        required: true
        type: "string"
      git_sha:
        description: "Source commit SHA"
        required: true
        type: "string"
      source_run_id:
        description: "Successful source workflow run ID"
        required: true
        type: "string"
      source_run_attempt:
        description: "Source workflow run attempt"
        required: true
        type: "string"
      live_probe:
        description: "Run live R2 scope proof using publisher credentials"
        required: false
        default: false
        type: "boolean"
      ttl_seconds:
        description: "Temporary credential lifetime in seconds"
        required: false
        default: "600"
        type: "choice"
        options:
          - "300"
          - "600"
      expiry_check:
        description: "Wait for expiry and prove subsequent writes fail closed"
        required: false
        default: false
        type: "boolean"
permissions:
  contents: "read"
concurrency:
  group: "r2-credential-check-flatpak-${{ inputs.channel }}"
  cancel-in-progress: false
jobs:
  checks:
    name: Run tests
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    if: "${{ github.event_name == 'workflow_dispatch' && github.repository == 'luminusOS/flatpak-repo' && github.ref == 'refs/heads/main' && github.ref_protected }}"
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      -
        name: "Install test dependencies"
        run: "python3 -m venv .venv\n.venv/bin/python -m pip install --only-binary=:all: -r requirements-dev.txt"
      -
        name: "Prepare disposable signing fixture root"
        run: "install -d -m 700 /tmp/opencode"
      -
        name: "Run repository and contract tests"
        run: ".venv/bin/python -B -m unittest discover -s tests -p 'test_*.py' -q\n.venv/bin/python -B -m unittest discover -s contracts -p 'test_*.py' -q"
  issuer-stable:
    name: Issue credentials (stable)
    needs: "checks"
    if: "${{ inputs.channel == 'stable' && github.event_name == 'workflow_dispatch' && github.repository == 'luminusOS/flatpak-repo' && github.ref == 'refs/heads/main' && github.ref_protected }}"
    environment: "issuer-stable"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      -
        name: "Check trusted issuer context"
        env:
          GATE_GITHUB_REPOSITORY: "${{ github.repository }}"
          GATE_GITHUB_REF: "${{ github.ref }}"
          GATE_GITHUB_REF_PROTECTED: "${{ github.ref_protected }}"
          GATE_GITHUB_EVENT_NAME: "${{ github.event_name }}"
          GATE_ENVIRONMENT: "issuer-stable"
        run: "python3 -B tools/signing_environment.py context --role issuer --channel stable"
      -
        name: "Issue and encrypt stable credentials"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          R2_PARENT_ACCESS_KEY_ID: "${{ secrets.R2_PARENT_ACCESS_KEY_ID }}"
          R2_PARENT_SECRET_ACCESS_KEY: "${{ secrets.R2_PARENT_SECRET_ACCESS_KEY }}"
          TRANSPORT_KEY: "${{ secrets.TRANSPORT_KEY }}"
          RELEASE_PACKAGE_ID: "${{ inputs.package_id }}"
          RELEASE_VERSION: "${{ inputs.version }}"
          RELEASE_GIT_SHA: "${{ inputs.git_sha }}"
          RELEASE_SOURCE_RUN_ID: "${{ inputs.source_run_id }}"
          RELEASE_SOURCE_RUN_ATTEMPT: "${{ inputs.source_run_attempt }}"
          RELEASE_TTL_SECONDS: "${{ inputs.ttl_seconds }}"
          RELEASE_LIVE_PROBE: "${{ inputs.live_probe }}"
          RELEASE_EXPIRY_CHECK: "${{ inputs.expiry_check }}"
        run: "if [ \"$RELEASE_LIVE_PROBE\" = \"true\" ] && [ \"$RELEASE_EXPIRY_CHECK\" = \"true\" ] && [ \"$RELEASE_TTL_SECONDS\" != \"300\" ]; then exit 1; fi\npython3 -B tools/issuer.py issue --channel stable --package-id \"$RELEASE_PACKAGE_ID\" --version \"$RELEASE_VERSION\" --git-sha \"$RELEASE_GIT_SHA\" --source-run-id \"$RELEASE_SOURCE_RUN_ID\" --source-run-attempt \"$RELEASE_SOURCE_RUN_ATTEMPT\" --ttl \"$RELEASE_TTL_SECONDS\" --output \"$RUNNER_TEMP/r2-credentials.gpg\""
      -
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "r2-credential-check-flatpak-stable-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/r2-credentials.gpg"
          if-no-files-found: "error"
          retention-days: 1
          compression-level: 0
  issuer-testing:
    name: Issue credentials (testing)
    needs: "checks"
    if: "${{ inputs.channel == 'testing' && github.event_name == 'workflow_dispatch' && github.repository == 'luminusOS/flatpak-repo' && github.ref == 'refs/heads/main' && github.ref_protected }}"
    environment: "issuer-testing"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      -
        name: "Check trusted issuer context"
        env:
          GATE_GITHUB_REPOSITORY: "${{ github.repository }}"
          GATE_GITHUB_REF: "${{ github.ref }}"
          GATE_GITHUB_REF_PROTECTED: "${{ github.ref_protected }}"
          GATE_GITHUB_EVENT_NAME: "${{ github.event_name }}"
          GATE_ENVIRONMENT: "issuer-testing"
        run: "python3 -B tools/signing_environment.py context --role issuer --channel testing"
      -
        name: "Issue and encrypt testing credentials"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          R2_PARENT_ACCESS_KEY_ID: "${{ secrets.R2_PARENT_ACCESS_KEY_ID }}"
          R2_PARENT_SECRET_ACCESS_KEY: "${{ secrets.R2_PARENT_SECRET_ACCESS_KEY }}"
          TRANSPORT_KEY: "${{ secrets.TRANSPORT_KEY }}"
          RELEASE_PACKAGE_ID: "${{ inputs.package_id }}"
          RELEASE_VERSION: "${{ inputs.version }}"
          RELEASE_GIT_SHA: "${{ inputs.git_sha }}"
          RELEASE_SOURCE_RUN_ID: "${{ inputs.source_run_id }}"
          RELEASE_SOURCE_RUN_ATTEMPT: "${{ inputs.source_run_attempt }}"
          RELEASE_TTL_SECONDS: "${{ inputs.ttl_seconds }}"
          RELEASE_LIVE_PROBE: "${{ inputs.live_probe }}"
          RELEASE_EXPIRY_CHECK: "${{ inputs.expiry_check }}"
        run: "if [ \"$RELEASE_LIVE_PROBE\" = \"true\" ] && [ \"$RELEASE_EXPIRY_CHECK\" = \"true\" ] && [ \"$RELEASE_TTL_SECONDS\" != \"300\" ]; then exit 1; fi\npython3 -B tools/issuer.py issue --channel testing --package-id \"$RELEASE_PACKAGE_ID\" --version \"$RELEASE_VERSION\" --git-sha \"$RELEASE_GIT_SHA\" --source-run-id \"$RELEASE_SOURCE_RUN_ID\" --source-run-attempt \"$RELEASE_SOURCE_RUN_ATTEMPT\" --ttl \"$RELEASE_TTL_SECONDS\" --output \"$RUNNER_TEMP/r2-credentials.gpg\""
      -
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"
        with:
          name: "r2-credential-check-flatpak-testing-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/r2-credentials.gpg"
          if-no-files-found: "error"
          retention-days: 1
          compression-level: 0
  publisher-stable:
    name: Check credential scope (stable)
    needs: "issuer-stable"
    if: "${{ needs.issuer-stable.result == 'success' && github.event_name == 'workflow_dispatch' && github.repository == 'luminusOS/flatpak-repo' && github.ref == 'refs/heads/main' && github.ref_protected }}"
    environment: "publisher-stable"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      -
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        with:
          name: "r2-credential-check-flatpak-stable-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/capsule"
      -
        name: "Validate scope and synthetic SigV4 PUT"
        env:
          TRANSPORT_KEY: "${{ secrets.TRANSPORT_KEY }}"
          GATE_GITHUB_REPOSITORY: "${{ github.repository }}"
          GATE_GITHUB_REF: "${{ github.ref }}"
          GATE_GITHUB_REF_PROTECTED: "${{ github.ref_protected }}"
          GATE_GITHUB_EVENT_NAME: "${{ github.event_name }}"
          GATE_ENVIRONMENT: "publisher-stable"
        run: "python3 -B tools/signing_environment.py context --role publisher --channel stable\npython3 -B tools/issuer.py consume --channel stable --input \"$RUNNER_TEMP/capsule/r2-credentials.gpg\" --output \"$RUNNER_TEMP/check-credentials.json\""
      -
        name: "Run live R2 scope probe"
        if: "${{ inputs.live_probe }}"
        env:
          RELEASE_EXPIRY_CHECK: "${{ inputs.expiry_check }}"
        run: "if [ \"$RELEASE_EXPIRY_CHECK\" = \"true\" ]; then set -- --expiry-check; else set --; fi\npython3 -B tools/r2_probe.py --credentials \"$RUNNER_TEMP/check-credentials.json\" --channel stable --run-id \"$GITHUB_RUN_ID\" --attempt \"$GITHUB_RUN_ATTEMPT\" \"$@\""
      -
        name: "Remove temporary publisher credentials"
        if: "always()"
        run: "rm -f \"$RUNNER_TEMP/check-credentials.json\""
  publisher-testing:
    name: Check credential scope (testing)
    needs: "issuer-testing"
    if: "${{ needs.issuer-testing.result == 'success' && github.event_name == 'workflow_dispatch' && github.repository == 'luminusOS/flatpak-repo' && github.ref == 'refs/heads/main' && github.ref_protected }}"
    environment: "publisher-testing"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 15
    steps:
      -
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
      -
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"
        with:
          name: "r2-credential-check-flatpak-testing-${{ github.run_id }}-${{ github.run_attempt }}"
          path: "${{ runner.temp }}/capsule"
      -
        name: "Validate scope and synthetic SigV4 PUT"
        env:
          TRANSPORT_KEY: "${{ secrets.TRANSPORT_KEY }}"
          GATE_GITHUB_REPOSITORY: "${{ github.repository }}"
          GATE_GITHUB_REF: "${{ github.ref }}"
          GATE_GITHUB_REF_PROTECTED: "${{ github.ref_protected }}"
          GATE_GITHUB_EVENT_NAME: "${{ github.event_name }}"
          GATE_ENVIRONMENT: "publisher-testing"
        run: "python3 -B tools/signing_environment.py context --role publisher --channel testing\npython3 -B tools/issuer.py consume --channel testing --input \"$RUNNER_TEMP/capsule/r2-credentials.gpg\" --output \"$RUNNER_TEMP/check-credentials.json\""
      -
        name: "Run live R2 scope probe"
        if: "${{ inputs.live_probe }}"
        env:
          RELEASE_EXPIRY_CHECK: "${{ inputs.expiry_check }}"
        run: "if [ \"$RELEASE_EXPIRY_CHECK\" = \"true\" ]; then set -- --expiry-check; else set --; fi\npython3 -B tools/r2_probe.py --credentials \"$RUNNER_TEMP/check-credentials.json\" --channel testing --run-id \"$GITHUB_RUN_ID\" --attempt \"$GITHUB_RUN_ATTEMPT\" \"$@\""
      -
        name: "Remove temporary publisher credentials"
        if: "always()"
        run: "rm -f \"$RUNNER_TEMP/check-credentials.json\""
