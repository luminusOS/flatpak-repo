name: Check environment protections

on:
  pull_request:
  workflow_dispatch:
    inputs:
      role:
        description: Protected environment to verify
        required: true
        type: choice
        options:
          - issuer
          - publisher
      channel:
        description: Channel to verify
        required: true
        type: choice
        options:
          - stable
          - testing

permissions:
  contents: read

concurrency:
  group: environment-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pull-request-denial:
    name: Pull requests cannot enter environments
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Confirm pull requests cannot enter a signing environment
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          test "$EVENT_NAME" = pull_request
          case "$REF_NAME" in
            refs/pull/*/merge) ;;
            *) exit 1 ;;
          esac
          echo 'Pull request context denied; no signing environment was requested.'

  authorize-dispatch:
    name: Authorize dispatch
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'luminusOS/flatpak-repo' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted dispatch context
        env:
          GATE_GITHUB_REPOSITORY: ${{ github.repository }}
          GATE_GITHUB_REF: ${{ github.ref }}
          GATE_GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GATE_GITHUB_EVENT_NAME: ${{ github.event_name }}
          GATE_ENVIRONMENT: ${{ inputs.role }}-${{ inputs.channel }}
          GATE_ROLE: ${{ inputs.role }}
          GATE_CHANNEL: ${{ inputs.channel }}
        run: python3 -B tools/signing_environment.py context --role "$GATE_ROLE" --channel "$GATE_CHANNEL"
      - name: Prepare disposable signing fixtures
        run: install -d -m 700 /tmp/opencode
      - name: Install test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: -r requirements-dev.txt
      - name: Run repository tests
        run: .venv/bin/python -B -m unittest discover -s tests -p 'test_*.py' -v

  verify-disposable-canary:
    name: Verify environment canary
    needs: authorize-dispatch
    if: >-
      needs.authorize-dispatch.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'luminusOS/flatpak-repo' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.role }}-${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify only the disposable canary
        env:
          GATE_GITHUB_REPOSITORY: ${{ github.repository }}
          GATE_GITHUB_REF: ${{ github.ref }}
          GATE_GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          GATE_GITHUB_EVENT_NAME: ${{ github.event_name }}
          GATE_ENVIRONMENT: ${{ inputs.role }}-${{ inputs.channel }}
          GATE_CANARY: ${{ secrets.GATE_CANARY }}
          GATE_CANARY_SHA256: ${{ vars.GATE_CANARY_SHA256 }}
          GATE_ROLE: ${{ inputs.role }}
          GATE_CHANNEL: ${{ inputs.channel }}
        run: python3 -B tools/signing_environment.py check --role "$GATE_ROLE" --channel "$GATE_CHANNEL"
